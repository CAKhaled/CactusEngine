<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KH Engine IDE - Pro</title>

    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Monaco Editor -->
    <script src="vs/loader.js"></script>

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-side: #1e293b;
            --bg-editor: #0f172a;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --border: #334155;
            --radius: 12px;
            --font-main: 'Cairo', sans-serif;
            --font-mono: 'JetBrains Mono', 'Cascadia Code', monospace;
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Toolbar --- */
        .header {
            height: 60px;
            background: var(--bg-side);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent);
            margin-left: 20px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .nav-group {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px;
            border-radius: 10px;
        }

        .btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-family: var(--font-main);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: var(--border);
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-stop {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .btn-stop:not(:disabled):hover {
            background: var(--danger);
            color: white;
        }

        /* --- Workspace Layout --- */
        .workspace {
            display: flex;
            flex-grow: 1;
            padding: 12px;
            gap: 12px;
            height: calc(100vh - 60px);
        }

        .editor-container {
            flex: 3;
            display: flex;
            flex-direction: column;
            background: var(--bg-editor);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .panel-tab {
            background: var(--bg-side);
            padding: 10px 20px;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dim);
        }

        #editor {
            flex-grow: 1;
            height: 100%;
            min-height: 0;
            position: relative;
        }

        .sidebar {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .preview-panel {
            flex: 1.5;
            background: #000;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .preview-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
        }

        .console-panel {
            flex: 1;
            background: var(--bg-side);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }

        #console {
            flex-grow: 1;
            padding: 12px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.6;
            direction: ltr;
            text-align: left;
            background: #0a0f1a;
        }

        .c-out {
            color: #e2e8f0;
        }

        .c-err {
            color: #fda4af;
        }

        .c-info {
            color: #a5b4fc;
        }

        .c-succ {
            color: #6ee7b7;
        }

        .status-badge {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .status-running {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .hint-text {
            color: var(--text-dim);
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo-area">
            <div class="logo-icon">KH</div>
            <span>Engine IDE</span>
        </div>

        <div class="nav-group">
            <button class="btn" onclick="window.backend.new_file()">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                جديد
            </button>
            <button class="btn" onclick="window.backend.open_file()">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                </svg>
                فتح
            </button>
            <button class="btn" onclick="saveFile()">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4">
                    </path>
                </svg>
                حفظ
            </button>
        </div>

        <div style="flex-grow: 1;"></div>

        <div class="nav-group">
            <button class="btn btn-primary" id="btn-run" onclick="runCode()">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"></path>
                </svg>
                تشغيل
            </button>
            <button class="btn btn-stop" id="btn-stop" onclick="stopCode()" disabled>
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 6h12v12H6z"></path>
                </svg>
                إيقاف
            </button>
        </div>
    </header>

    <main class="workspace">
        <div class="editor-container">
            <div class="panel-tab" id="tab-label">
                <div class="status-badge" id="running-indicator"></div>
                <span id="filename-text">ملف جديد.kh</span>
            </div>
            <div id="editor" style="color: white; font-size: 24px;">جاري تحميل المحرر... إذا بقيت هذه الرسالة فهناك مشكلة في الاتصال!</div>
        </div>

        <div class="sidebar">
            <div class="preview-panel">
                <div class="panel-header">
                    <span>شاشة العرض المباشر</span>
                    <svg width="14" height="14" fill="var(--text-dim)" viewBox="0 0 24 24">
                        <path
                            d="M21 16.5c0 .38-.21.71-.53.88l-7.97 4.44c-.31.17-.69.17-1 0L3.53 17.38C3.21 17.21 3 16.88 3 16.5v-9c0-.38.21-.71.53-.88l7.97-4.44c.31-.17.69-.17 1 0l7.97 4.44c.32.17.53.5.53.88v9z">
                        </path>
                    </svg>
                </div>
                <div class="preview-content" id="preview-body">
                    <div id="pv-placeholder">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--border)"
                            stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                        <div class="hint-text" id="pv-hint">بانتظار تشغيل الكود...</div>
                    </div>
                </div>
            </div>

            <div class="console-panel">
                <div class="panel-header">
                    <span>مخرجات النظام</span>
                    <button class="btn" style="padding: 2px 8px; font-size: 11px;"
                        onclick="document.getElementById('console').innerHTML=''">مسح</button>
                </div>
                <div id="console"></div>
            </div>
        </div>
    </main>

    <script>
        // === التواصل مع Electron ===
        document.addEventListener("DOMContentLoaded", function() {
            const rect = document.getElementById('preview-body').getBoundingClientRect();
            window.electronAPI.updateBounds({ x: rect.left, y: rect.top, width: rect.width, height: rect.height });
        });

        const consoleEl = document.getElementById('console');
        function appendConsole(text, type = 'out') {
            const span = document.createElement('span');
            span.style.color = type === 'err' ? '#ef4444' : '#94a3b8';
            span.innerText = text;
            consoleEl.appendChild(span);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        window.electronAPI.onConsoleOut((text) => appendConsole(text, 'out'));
        window.electronAPI.onConsoleErr((text) => appendConsole(text, 'err'));
        window.electronAPI.onRunFinished(() => window.ide.setRunState(false));

        window.ide = {
            setTabName: (name) => { document.getElementById('filename-text').innerText = name; },
            getEditorContent: () => window.editor ? window.editor.getValue() : "",
            setEditorContent: (content) => { 
                if(window.editor) {
                    window.editor.setValue(content); 
                } else {
                    alert("المحرر لم يتم تحميله بعد!");
                }
            },
            consoleOut: (t) => appendConsole(t, 'out'),
            consoleErr: (t) => appendConsole(t, 'err'),
            consoleInfo: (t) => appendConsole(t, 'info'),
            consoleSucc: (t) => appendConsole(t, 'succ'),
            clearConsole: () => consoleEl.innerHTML = '',

            setRunState: (running) => {
                document.getElementById('btn-run').disabled = running;
                document.getElementById('btn-stop').disabled = !running;
                document.getElementById('running-indicator').className = running ? 'status-badge status-running' : 'status-badge';
                document.getElementById('pv-placeholder').style.display = running ? 'none' : 'block';
            },

            setErrorState: () => {
                window.ide.setRunState(false);
                document.getElementById('pv-hint').innerText = "حدث خطأ في التشغيل";
                document.getElementById('pv-hint').style.color = "var(--danger)";
            }
        };

        async function newFile() {
            await window.electronAPI.newFile();
            window.ide.currentFile = "";
            window.ide.setEditorContent("# ملف جديد\n");
            document.getElementById('filename-text').innerText = "ملف جديد.kh";
        }

        async function openFile() {
            try {
                const res = await window.electronAPI.openFile();
                if (res) {
                    window.ide.currentFile = res.path;
                    window.ide.setEditorContent(res.content);
                    document.getElementById('filename-text').innerText = res.path.split('\\').pop();
                }
            } catch (e) {
                alert("Error opening file: " + e.message);
            }
        }

        async function saveFile() {
            if (!window.editor) return;
            const content = window.editor.getValue();
            const res = await window.electronAPI.saveFile(window.ide.currentFile, content);
            if (res) {
                window.ide.currentFile = res;
                document.getElementById('filename-text').innerText = res.split('\\').pop();
            }
        }

        function runCode() {
            if (!window.ide.currentFile) {
                alert("يرجى حفظ الملف أولاً قبل التشغيل.");
                return;
            }
            saveFile().then(() => {
                window.ide.setRunState(true);
                window.electronAPI.runCode(window.ide.currentFile);
            });
        }

        function stopCode() { 
            window.electronAPI.stopCode();
            window.ide.setRunState(false);
        }

        // === Monaco Editor Setup ===
        try {
            require.config({ paths: { 'vs': 'vs' } });
            require(['vs/editor/editor.main'], function () {
                try {
                    monaco.languages.register({ id: 'kh' });
                    monaco.languages.setMonarchTokensProvider('kh', {
                        tokenizer: {
                            root: [
                                [/(ابغا|اطبع|تشغيل|كل_فريم|إذا|اذا|وإلا|كرر|توقف)\b/, "keyword"],
                                [/(نافذة|صنع_مكعب|صنع_ضوء|صنع_كرة|صنع_هرم|تحميل_خامة|لون)(?=\()/, "type.identifier"],
                                [/#[^\n]*/, "comment"],
                                [/"[^"]*"/, "string"],
                                [/\b\d+\b/, "number"],
                            ]
                        }
                    });

                    monaco.editor.defineTheme('kh-pro', {
                        base: 'vs-dark',
                        inherit: true,
                        rules: [
                            { token: 'keyword', foreground: '818cf8', fontStyle: 'bold' },
                            { token: 'type.identifier', foreground: '34d399' },
                            { token: 'comment', foreground: '64748b', fontStyle: 'italic' },
                            { token: 'string', foreground: 'fbbf24' },
                        ],
                        colors: {
                            'editor.background': '#0f172a',
                            'editor.lineHighlightBackground': '#1e293b',
                            'editorCursor.foreground': '#6366f1',
                            'editor.selectionBackground': '#334155',
                            'editorLineNumber.foreground': '#475569',
                        }
                    });

                    document.getElementById('editor').innerHTML = ""; // clear debug text
                    window.editor = monaco.editor.create(document.getElementById('editor'), {
                        value: "# ابدأ برمجة عالمك الخاص بـ KH Engine...\n\nنافذة(العنوان=\"مشروعي الأول\")\n\nصنع_مكعب(اللون=لون.أزرق)\n",
                        language: 'kh',
                        theme: 'kh-pro',
                        fontSize: 15,
                        fontFamily: 'JetBrains Mono',
                        minimap: { enabled: false },
                        automaticLayout: true,
                        padding: { top: 20 }
                    });
                } catch (e) {
                    document.getElementById('editor').innerText = "حدث خطأ أثناء تشغيل المحرر: " + e.toString();
                }
            });
        } catch (err) {
            document.getElementById('editor').innerText = "حدث خطأ في تحميل ملفات المحرر: " + err.toString();
        }

        // متابعة حجم شاشة العرض لـ Python
        const ro = new ResizeObserver(() => {
            const rect = document.getElementById('preview-body').getBoundingClientRect();
            window.electronAPI.updateBounds({ x: rect.left, y: rect.top, width: rect.width, height: rect.height });
        });
        ro.observe(document.getElementById('preview-body'));
    </script>
</body>

</html>
